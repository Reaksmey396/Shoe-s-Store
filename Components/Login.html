<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoleStyle</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style type="text/tailwindcss">
        @theme {
            --color-clifford: #da373d;
        }
    </style>
    <style>
        body {
            font-family: "Poppins", Arial, sans-serif;
        }

        .login-input:-webkit-autofill,
        .login-input:-webkit-autofill:hover,
        .login-input:-webkit-autofill:focus {
            background-color: transparent !important;
            background-image: none !important;
            box-shadow: none !important;
            -webkit-box-shadow: none !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: #fff !important;
            caret-color: #fff;
            outline: none !important;
        }

        .login-input {
            background-color: transparent !important;
            background-image: none !important;
            background-clip: padding-box;
            appearance: none;
            -webkit-appearance: none;
            color: #fff;
            caret-color: #fff;
        }

        .login-input:focus,
        .login-input:focus-visible {
            border-color: #f97316 !important;
            box-shadow: none !important;
            outline: none !important;
        }

        .login-input:not(:placeholder-shown) {
            background-color: transparent !important;
            background-image: none !important;
            box-shadow: none !important;
            -webkit-box-shadow: none !important;
            color: #fff !important;
            -webkit-text-fill-color: #fff !important;
        }

        .login-input:-webkit-autofill,
        .login-input:-webkit-autofill:hover,
        .login-input:-webkit-autofill:focus,
        .login-input:focus:-webkit-autofill,
        .login-input:focus-visible:-webkit-autofill {
            background-color: transparent !important;
            background-image: none !important;
            box-shadow: none !important;
            -webkit-box-shadow: none !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: #fff !important;
            border-color: #f97316 !important;
            outline: none !important;
        }
    </style>
</head>

<body>

    <main class="relative min-h-screen flex items-center justify-center px-5 overflow-hidden">

        <!--  Background -->
        <img class="absolute w-full h-full" src="https://i.pinimg.com/736x/1b/36/7f/1b367f03faeca7953f4504fdcb0ee5bb.jpg" alt="">
        <img class="absolute sm:hidden w-full h-full" src="https://i.pinimg.com/736x/7d/47/20/7d47204553644eac0abe85f8f263c674.jpg" alt="">

        <div class="w-full max-w-md backdrop-blur-sm bg-none border border-white/20 rounded-3xl shadow-2xl p-8 z-10">

            <div class="text-center mb-8">

                <i class="fa-solid fa-shoe-prints text-5xl text-gray-100"></i>

                <h1 class="text-4xl font-bold text-gray-100 mt-4">
                    Welcome Back
                </h1>

                <p class="text-gray-200 mt-2">
                    Sign in to your SoleStyle account
                </p>

            </div>

            <form autocomplete="off" data-form-type="other" class="space-y-5">

                <!-- Email -->
                <div class="relative">

                    <input required autocomplete="new-password" name="login-email-no-autofill" readonly data-lpignore="true"
                        data-1p-ignore="true"
                        onfocus="this.removeAttribute('readonly')" type="text" inputmode="email" placeholder="Enter your email..." class="login-input w-full py-3 px-5 pr-12
                               rounded-full
                               bg-none
                               text-orange-500
                               placeholder:text-orange-300
                               border border-white/40
                               outline-none
                               focus:border-orange-500
                               focus:ring-0">

                    <i class="fa-solid fa-envelope absolute right-5 top-1/2 -translate-y-1/2 text-white">
                    </i>

                </div>

                <!-- Password -->
                <div class="relative">

                    <input required autocomplete="new-password" name="login-password-no-autofill" readonly data-lpignore="true"
                        data-1p-ignore="true"
                        onfocus="this.removeAttribute('readonly')" type="password" placeholder="Enter your password..." class="login-input w-full py-3 px-5 pr-12 rounded-full
                               bg-none text-white
                               placeholder:text-orange-300
                               outline-none
                               border border-white/40
                               focus:border-orange-500
                               focus:ring-0">

                    <i class="fa-solid fa-lock absolute right-5 top-1/2 -translate-y-1/2 text-white">
                    </i>

                </div>

                <!-- Remember -->
                <div class="flex justify-between text-sm text-white">

                    <label class="flex gap-2">
                        <input type="checkbox">
                        Remember Me
                    </label>

                    <a href="#" class="hover:text-red-300">
                        Forgot Password?
                    </a>

                </div>

                <!-- Button -->
                <button class="w-full py-3 rounded-full
                           bg-orange-500
                           hover:bg-orange-600
                           text-gray-100
                           font-bold
                           transition">

                    Login

                </button>

            </form>
            <p class="text-center text-white mt-6">
                Don't have an account?
                <a href="Register.html" class=" text-orange-500 hover:text-orange-300">
                    Register
                </a>
            </p>
        </div>
    </main>
</body>
</html>
